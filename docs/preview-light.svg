<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Horizon light theme palette preview</title>
  <desc id="desc">A dashboard mockup over a soft teal, blue and peach gradient with translucent cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f2ee"/><stop offset=".55" stop-color="#e7eef3"/><stop offset="1" stop-color="#f4eee8"/></linearGradient>
    <radialGradient id="teal"><stop stop-color="#8dc3ae" stop-opacity=".72"/><stop offset="1" stop-color="#8dc3ae" stop-opacity="0"/></radialGradient>
    <radialGradient id="peach"><stop stop-color="#eeb997" stop-opacity=".7"/><stop offset="1" stop-color="#eeb997" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#344b48" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/><ellipse cx="180" cy="110" rx="430" ry="300" fill="url(#teal)"/><ellipse cx="1050" cy="135" rx="370" ry="280" fill="url(#peach)"/>
  <rect x="0" y="0" width="1200" height="72" rx="32" fill="#f3f8f6" fill-opacity=".9"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263b3b">Home</text><circle cx="1130" cy="36" r="18" fill="#477c78" fill-opacity=".18"/><circle cx="1130" cy="36" r="7" fill="#477c78"/>
  <text x="46" y="130" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#58706e">MONDAY · 08:42</text><text x="44" y="183" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#263b3b">A calmer view of home</text><text x="46" y="218" font-family="Arial,sans-serif" font-size="18" fill="#58706e">Quiet colors, clear information.</text>
  <g filter="url(#shadow)"><rect x="42" y="264" width="350" height="188" rx="22" fill="#fafdfc" fill-opacity=".86"/><rect x="422" y="264" width="350" height="188" rx="22" fill="#fafdfc" fill-opacity=".86"/><rect x="802" y="264" width="350" height="188" rx="22" fill="#fafdfc" fill-opacity=".86"/><rect x="42" y="480" width="730" height="190" rx="22" fill="#fafdfc" fill-opacity=".86"/><rect x="802" y="480" width="350" height="190" rx="22" fill="#fafdfc" fill-opacity=".86"/></g>
  <g font-family="Arial,sans-serif"><text x="70" y="308" font-size="16" fill="#58706e">INDOOR</text><text x="70" y="375" font-size="54" font-weight="700" fill="#263b3b">21.5°</text><text x="260" y="374" font-size="18" fill="#477c78">Comfortable</text><text x="450" y="308" font-size="16" fill="#58706e">LIGHTS</text><text x="450" y="375" font-size="54" font-weight="700" fill="#263b3b">4</text><text x="530" y="374" font-size="18" fill="#58706e">on right now</text><text x="830" y="308" font-size="16" fill="#58706e">ENERGY TODAY</text><text x="830" y="375" font-size="44" font-weight="700" fill="#263b3b">8.4 kWh</text><text x="72" y="526" font-size="16" fill="#58706e">ROOMS</text><text x="72" y="578" font-size="24" font-weight="700" fill="#263b3b">Living room</text><text x="72" y="615" font-size="17" fill="#58706e">Warm light · 21.5° · Air quality good</text><text x="832" y="526" font-size="16" fill="#58706e">OUTSIDE</text><text x="832" y="580" font-size="38" font-weight="700" fill="#263b3b">16°</text><text x="832" y="617" font-size="17" fill="#58706e">Soft cloud cover</text></g>
