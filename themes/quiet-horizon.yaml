Quiet Horizon:
  primary-color: "#477c78"
  accent-color: "#c87454"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "0 8px 28px rgba(25, 45, 55, 0.10)"
  modes:
    light:
      primary-background-color: "#edf3f1"
      secondary-background-color: "#e4ecea"
      card-background-color: "rgba(250, 253, 252, 0.84)"
      primary-text-color: "#263b3b"
      secondary-text-color: "#58706e"
      disabled-text-color: "#879795"
      divider-color: "rgba(50, 77, 74, 0.12)"
      app-header-background-color: "rgba(243, 248, 246, 0.88)"
      app-header-text-color: "#263b3b"
      sidebar-background-color: "rgba(239, 245, 243, 0.92)"
      sidebar-text-color: "#38504e"
      sidebar-selected-background-color: "rgba(71, 124, 120, 0.14)"
      lovelace-background: "radial-gradient(ellipse at 14% 8%, rgba(141, 195, 174, 0.48) 0%, transparent 39%), radial-gradient(ellipse at 88% 12%, rgba(238, 185, 151, 0.46) 0%, transparent 36%), linear-gradient(145deg, #e9f2ee 0%, #e7eef3 52%, #f4eee8 100%)"
      ha-card-backdrop-filter: "blur(12px)"
      state-active-color: "#477c78"
      state-unavailable-color: "#879795"
    dark:
      primary-background-color: "#182526"
      secondary-background-color: "#202f30"
      card-background-color: "rgba(38, 55, 56, 0.86)"
      primary-text-color: "#e6efec"
      secondary-text-color: "#b1c3be"
      disabled-text-color: "#758783"
      divider-color: "rgba(195, 219, 210, 0.12)"
      app-header-background-color: "rgba(26, 40, 41, 0.88)"
      app-header-text-color: "#e6efec"
      sidebar-background-color: "rgba(25, 39, 40, 0.94)"
      sidebar-text-color: "#c5d5d0"
      sidebar-selected-background-color: "rgba(118, 179, 158, 0.18)"
      lovelace-background: "radial-gradient(ellipse at 14% 8%, rgba(53, 103, 90, 0.52) 0%, transparent 40%), radial-gradient(ellipse at 88% 12%, rgba(116, 77, 66, 0.42) 0%, transparent 36%), linear-gradient(145deg, #172525 0%, #1b292f 55%, #282321 100%)"
      ha-card-backdrop-filter: "blur(12px)"
      state-active-color: "#8fc8b2"
      state-unavailable-color: "#758783"
